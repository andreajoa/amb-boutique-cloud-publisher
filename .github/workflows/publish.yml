name: AMB Boutique - YouTube Auto Publisher
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amb-boutique-youtube-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audited publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API packages
        run: pip install -r requirements.txt
      - name: Publish the newest queued item, only if authorized
        env:
          AUTO_PUBLISH_ENABLED: ${{ secrets.AUTO_PUBLISH_ENABLED }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          DRIVE_READY_FOLDER_ID: ${{ secrets.DRIVE_READY_FOLDER_ID }}
          DRIVE_PUBLISHED_FOLDER_ID: ${{ secrets.DRIVE_PUBLISHED_FOLDER_ID }}
          DRIVE_REVIEW_FOLDER_ID: ${{ secrets.DRIVE_REVIEW_FOLDER_ID }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python cloud_publisher.py
