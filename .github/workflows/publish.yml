name: AMB Boutique - YouTube Auto Publisher
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amb-boutique-youtube-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API libraries
        run: pip install -r requirements.txt
      - name: Check YouTube queue and publish one eligible video
        env:
          AUTO_PUBLISH_ENABLED: ${{ secrets.AUTO_PUBLISH_ENABLED }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DRIVE_SHORTS_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_FOLDER_ID }}
          DRIVE_HORIZONTAL_FOLDER_ID: ${{ secrets.DRIVE_HORIZONTAL_FOLDER_ID }}
          DRIVE_POSTED_SHORTS_ID: ${{ secrets.DRIVE_POSTED_SHORTS_ID }}
          DRIVE_POSTED_HORIZONTAL_ID: ${{ secrets.DRIVE_POSTED_HORIZONTAL_ID }}
          DRIVE_REVIEW_SHORTS_ID: ${{ secrets.DRIVE_REVIEW_SHORTS_ID }}
          DRIVE_REVIEW_HORIZONTAL_ID: ${{ secrets.DRIVE_REVIEW_HORIZONTAL_ID }}
        run: python cloud_publisher.py
