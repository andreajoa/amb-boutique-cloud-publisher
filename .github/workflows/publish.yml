name: AMB Boutique - YouTube Auto Publisher
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify credentials and queues without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amb-boutique-youtube-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg (ffprobe validates every video before upload)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffprobe -version | head -1
      - name: Install Google API libraries
        run: pip install -r requirements.txt
      - name: Test publisher
        run: python -m unittest -q
      - name: Check YouTube queue and publish one eligible video
        env:
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          GOOGLE_OWNER_EMAIL: ${{ secrets.GOOGLE_OWNER_EMAIL }}
          YOUTUBE_CHANNEL_HANDLE: ${{ secrets.YOUTUBE_CHANNEL_HANDLE }}
          AUTO_PUBLISH_ENABLED: ${{ secrets.AUTO_PUBLISH_ENABLED }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DRIVE_SHORTS_FOLDER_ID: ${{ secrets.DRIVE_SHORTS_FOLDER_ID }}
          DRIVE_HORIZONTAL_FOLDER_ID: ${{ secrets.DRIVE_HORIZONTAL_FOLDER_ID }}
          DRIVE_POSTED_SHORTS_ID: ${{ secrets.DRIVE_POSTED_SHORTS_ID }}
          DRIVE_POSTED_HORIZONTAL_ID: ${{ secrets.DRIVE_POSTED_HORIZONTAL_ID }}
          DRIVE_REVIEW_SHORTS_ID: ${{ secrets.DRIVE_REVIEW_SHORTS_ID }}
          DRIVE_REVIEW_HORIZONTAL_ID: ${{ secrets.DRIVE_REVIEW_HORIZONTAL_ID }}
        run: python cloud_publisher.py
